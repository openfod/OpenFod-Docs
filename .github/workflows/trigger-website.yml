name: Trigger Website deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OpenFod-Website Pages workflow
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not configured on OpenFod-Docs."
            echo "Set a token that can workflow_dispatch openfod/OpenFod-Website, then re-run."
            exit 1
          fi
          gh workflow run pages.yml --repo openfod/OpenFod-Website --ref main
